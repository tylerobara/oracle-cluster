apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kubeinspect-secrets
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: {{ .Values.secretStoreRef.name }}
    kind: {{ .Values.secretStoreRef.kind }}
  target:
    name: kubeinspect-secrets
  data:
{{- range $k := list "jwt_secret" "bootstrap_token" "admin_password" }}
  - secretKey: {{ $k }}
    remoteRef:
      key: home/kubeinspect
      property: {{ $k }}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kubeinspect-registry
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: {{ .Values.secretStoreRef.name }}
    kind: {{ .Values.secretStoreRef.kind }}
  target:
    name: kubeinspect-registry
    template:
      type: kubernetes.io/dockerconfigjson
  data:
  - secretKey: .dockerconfigjson
    remoteRef:
      key: home/kubeinspect-registry
      property: dockerconfigjson
