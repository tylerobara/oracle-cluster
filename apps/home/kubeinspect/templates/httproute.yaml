apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubeinspect
  annotations:
    gethomepage.dev/href: "https://{{ .Values.host }}"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "KubeInspect"
    gethomepage.dev/description: "Kubernetes image vulnerability console"
    gethomepage.dev/group: "Services"
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway-system
      sectionName: websecure
  hostnames:
    - {{ .Values.host }}
  rules:
    - backendRefs:
        - name: kubeinspect
          port: 8080
