apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeinspect
  labels:
    app.kubernetes.io/name: kubeinspect
spec:
  # Single replica: the scan scheduler has no distributed lock.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kubeinspect
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubeinspect
    spec:
      imagePullSecrets:
        - name: kubeinspect-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KUBEINSPECT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.clusterName }}-app
                  key: uri
            - name: KUBEINSPECT_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kubeinspect-secrets
                  key: jwt_secret
            - name: KUBEINSPECT_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kubeinspect-secrets
                  key: bootstrap_token
            - name: KUBEINSPECT_ADMIN_EMAIL
              value: tyler.obara@gmail.com
            - name: KUBEINSPECT_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kubeinspect-secrets
                  key: admin_password
            # Trivy is bundled in the image to serve the vulnerability DB to
            # agents (KUBEINSPECT_TRIVY_PROXY); this only disables the
            # server-side local-scan fallback.
            - name: KUBEINSPECT_LOCAL_SCANS
              value: "false"
          volumeMounts:
            # The bundled trivy writes its DB/artifact cache to
            # /tmp/trivy-cache, and the root filesystem is read-only.
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            tcpSocket:
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              # Holds the trivy vulnerability DB while the proxy is serving it.
              memory: 1Gi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kubeinspect
spec:
  selector:
    app.kubernetes.io/name: kubeinspect
  ports:
    - name: http
      port: 8080
      targetPort: http
