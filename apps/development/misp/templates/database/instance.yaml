apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: {{ .Values.database.clusterName }}-db
spec:
  replicas: 1

  port: 3306

  # MISP's entrypoint injects MYSQL_PASSWORD into database.php via `sed`, which
  # mistreats `&`, `\` and `/` in the replacement text. mariadb-operator's
  # auto-generated root password can contain those characters, so we bring our
  # own sed-safe password for a dedicated app user instead of using root.
  database: {{ .Values.database.clusterName }}
  username: {{ .Values.database.username }}
  passwordSecretKeyRef:
    name: {{ .Values.externalSecrets.target.name }}
    key: mysql-password

  storage:
    size: {{ .Values.database.size }}
    {{- if hasKey .Values.database "storageClass" }}
    storageClass: {{ .Values.database.storageClass | quote }}
    {{- end }}

  myCnf: |
    [mariadb]
    bind-address=*
    default_storage_engine=InnoDB
    binlog_format=row
    innodb_autoinc_lock_mode=2

  resources:
    requests:
      cpu: {{ .Values.database.resources.requests.cpu }}
      memory: {{ .Values.database.resources.requests.memory }}
    limits:
      memory: {{ .Values.database.resources.limits.memory }}

  metrics:
    enabled: {{ .Values.database.metrics.enabled }}
