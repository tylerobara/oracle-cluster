{{- range .Values.misp.cronJobs }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: misp-cron-{{ .name }}
  labels:
    app.kubernetes.io/name: misp-cron
spec:
  schedule: {{ .schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: misp-cron
        spec:
          restartPolicy: Never
          containers:
            - name: curl
              image: {{ $.Values.misp.cronJobImage }}
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - 'curl -s -X POST -H "Authorization: ${ADMIN_KEY}" -H "Accept: application/json" -H "Content-Type: application/json" "http://misp-nginx:8080{{ .path }}"'
              env:
                - name: ADMIN_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ $.Values.externalSecrets.target.name }}
                      key: admin-key
---
{{- end }}
