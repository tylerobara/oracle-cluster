database:
  image:
    registry: ghcr.io
    repository: cloudnative-pg/postgresql
    tag: 18

  clusterName: pocketid
  logLevel: error
  replicas: 1
  size: 100Mi

  monitoring:
    enabled: false

  backups:
    enabled: false
    secretName: ''
    retention: ''
    path: ''
    endpoint: ''

  topologySpreadConstraints:

app-template:
  controllers:
    pocketid:
      strategy: Recreate
      containers:
        main:
          image:
            repository: 11notes/pocket-id
            tag: 2.16.0@sha256:010206abace875de8edde125de2f2547412dff2bdb8975f083286d5f82b41d18
            pullPolicy: IfNotPresent
          env:
            TZ: "America/New_York"
            APP_URL: "https://id.cloud.obara.xyz"
            TRUST_PROXY: true
            ENCRYPTION_KEY:
              valueFrom:
                secretKeyRef:
                  name: pocketid-secrets
                  key: ENCRYPTION_KEY
            DB_CONNECTION_STRING:
              valueFrom:
                secretKeyRef:
                  name: pocketid-app
                  key: uri

  service:
    pocketid:
      controller: pocketid
      ports:
        http:
          port: 1411

  ingress:
    pocketid:
      enabled: false

  persistence:
    pocketid:
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 250Mi
      globalMounts:
        - path: /pocket-id/var

