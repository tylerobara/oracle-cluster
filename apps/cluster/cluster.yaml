apps:
  cluster:
    argocd:
      deploy: true
      namespace: argocd
      serverSideApply: true
      ignoreDifferences:
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jqPathExpressions:
            - .spec.data[]?.remoteRef.conversionStrategy
            - .spec.data[]?.remoteRef.decodingStrategy
            - .spec.data[]?.remoteRef.metadataPolicy
    cloudnative-postgres:
      deploy: true
      namespace: storage
      serverSideApply: true
      ignoreDifferences:
      - group: admissionregistration.k8s.io
        kind: MutatingWebhookConfiguration
        jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
      - group: admissionregistration.k8s.io
        kind: ValidatingWebhookConfiguration
        jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
    pocketid:
      deploy: true
      namespace: default
    traefik:
      deploy: false
      namespace: traefik
    guacamole:
      deploy: false
      namespace: guacamole
    mariadb:
      deploy: true
      namespace: storage
    velld:
      deploy: false
      namespace: default
    homepage:
      deploy: true
      namespace: default
    external-secrets:
      deploy: true
      namespace: external-secrets
      serverSideApply: true
    openbao:
      deploy: true
      namespace: openbao
      # ignoreDifferences:
      #   - group: admissionregistration.k8s.io/v1
      #     kind: MutatingWebhookConfiguration
      #     jqPathExpressions:
      #       - .spec.data[]?.remoteRef.conversionStrategy
      #       - .spec.data[]?.remoteRef.decodingStrategy
      #       - .spec.data[]?.remoteRef.metadataPolicy
    postgresus:
      deploy: true
      namespace: default
    cert-manager:
      deploy: true
      namespace: kube-system
    authentik:
      deploy: false
      namespace: default
    newt:
      deploy: true
      namespace: kube-system
    envoy-gateway-crds:
      deploy: true
      namespace: envoy-gateway-system
      serverSideApply: true
    envoy-gateway:
      deploy: true
      namespace: envoy-gateway-system
    oauth2-proxy:
      deploy: true
      namespace: oauth2-proxy
    keycloak-gateway-route:
      deploy: true
      namespace: default
