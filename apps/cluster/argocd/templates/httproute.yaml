apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    gethomepage.dev/href: "https://argo.cloud.obara.xyz"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "ArgoCD"
    gethomepage.dev/description: "Continuous Delivery"
    gethomepage.dev/group: "Development"
    gethomepage.dev/icon: "sh-argo-cd.svg"
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway-system
      sectionName: websecure
  hostnames:
    - argo.cloud.obara.xyz
  rules:
    - backendRefs:
        - name: argocd-server
          port: 8080
