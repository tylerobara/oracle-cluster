openbao:
  server:
    dataStorage:
      size: 2Gi
    ingress:
      enabled: false
    # Data migrated from the removed "file" backend to raft via
    # `bao operator migrate` (2.6.2) on 2026-10-06. Same unseal keys/root token.
    standalone:
      enabled: true
      config: |
        ui = true

        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
        }

        storage "raft" {
          path    = "/openbao/data/raft"
          node_id = "openbao-0"
        }
